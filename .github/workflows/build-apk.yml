name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd android_client
          gradle assembleDebug --no-daemon

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp android_client/app/build/outputs/apk/debug/*.apk release-artifacts/PCRemote.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-debug-apk
          path: release-artifacts/PCRemote.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "PC Remote v1.1.0 (Affinity Drawing Pad & Stylus Revamp)"
          body: |
            ## 🎨 PC Remote & Drawing Pad for Android (v1.1.0)
            Major Drawing Pad revamp tailored for **Affinity Designer & Affinity Photo** on Windows with **Advan Sketsa 2 Stylus Pen**!

            ### ✨ What's New in v1.1.0:
            * **🎨 Dedicated Affinity Drawing Pad (Screen Mirror Mode):** Mirror your laptop screen and draw directly in Affinity with 1:1 stylus alignment.
            * **⚡ Hardware Stylus Pressure Sensitivity:** Real-time tracking of pen pressure (0.0 to 1.0) with a live visual pressure gauge.
            * **🖐️ Strict Palm Rejection:** Rest your hand, wrist, and palm freely on the tablet screen while drawing without accidental brush strokes.
            * **🎯 0ms Local Inking Feedback:** Smooth real-time local stroke trail rendered directly under the pen tip so sketching feels instantaneous.
            * **🔍 Two-Finger Canvas Navigation:** Pinch-to-zoom and two-finger pan to zoom into fine details while drawing.
            * **🎨 Floating Artist Toolbar:** Dockable (Left/Right) and minimizable palette with one-tap shortcuts for Affinity: Undo, Redo, Brush (`B`), Eraser (`E`), Pen (`P`), Node (`A`), Select (`V`), Pan/Hand (`H`/Space), Brush Size +/- (`[` / `]`), Eyedropper (`I`), and Fit Screen (`Ctrl+0`).
            * **🚀 High-FPS & Low Latency Streaming:** 45-60 FPS low-latency canvas stream optimized for fluid digital art.

            ### 🚀 Quick Start
            1. Download and install `PCRemote.apk` below on your Advan Sketsa 2 tablet.
            2. On your laptop, open Affinity (Designer or Photo) and launch `start_server.bat`.
            3. Connect from your tablet and enjoy drawing directly on your Windows PC!
          files: |
            release-artifacts/PCRemote.apk
            allow_firewall.bat
            start_server.bat
            setup_laptop_2.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
