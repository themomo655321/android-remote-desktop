name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd android_client
          gradle assembleDebug --no-daemon

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp android_client/app/build/outputs/apk/debug/*.apk release-artifacts/PCRemote.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-debug-apk
          path: release-artifacts/PCRemote.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "PC Remote v1.0.2 (Direct APK Download)"
          body: |
            ## 📱 PC Remote & Screen Mirror for Android (v1.0.2)
            Major feature update for **Advan Sketsa 2** and Android phones!

            ### ✨ What's New in v1.0.2:
            * **🖥️ Extended Monitor & Multi-Display Switcher**: Easily switch between Display 1 (Laptop), Display 2 (Extended Monitor), or All Displays (Combined)!
            * **⌨️ Real-Time Mobile Typing**: Open your native Android keyboard (Gboard, Samsung, tablet keyboard dock) and type stroke-by-stroke directly to Windows.
            * **☀️ Laptop Screen Brightness**: Control laptop backlight directly from your tablet (Dim -10%, Brighten +10%, and 0-100% Slider).
            * **✋ Drag Lock (Click & Hold)**: Tap "Drag Lock" to lock left-click down for easy window dragging, text selection, and moving files.
            * **🔄 Reverse Scrolling Setting**: Option to invert trackpad scrolling direction to match natural scrolling.

            ### 🚀 Quick Start
            1. Download `PCRemote.apk` below on your tablet or phone.
            2. Tap the downloaded file to install (if you already have v1.0.1, the in-app updater can also update directly).
            3. On your laptop, run `start_server.bat`.
            4. Open the PC Remote app on your tablet and connect!
          files: release-artifacts/PCRemote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
