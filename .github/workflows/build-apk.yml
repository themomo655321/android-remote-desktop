name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd android_client
          gradle assembleDebug --no-daemon

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp android_client/app/build/outputs/apk/debug/*.apk release-artifacts/PCRemote.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-debug-apk
          path: release-artifacts/PCRemote.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "PC Remote v1.0.3 (Direct APK Download)"
          body: |
            ## 📱 PC Remote & Screen Mirror for Android (v1.0.3)
            Major Multi-Laptop update!

            ### ✨ What's New in v1.0.3:
            * **💻 Multi-Laptop Switcher**: Save multiple laptops (Personal Laptop, Work Laptop) and switch between them in 1-tap from your tablet header!
            * **🚀 Auto-Install Host Script**: Added `setup_laptop_2.bat` for 1-click automatic host setup on any second Windows laptop.
            * **🖥️ Extended Monitor & Multi-Display Support**: Display 1, Display 2, or All Displays.
            * **⌨️ Real-Time Mobile Keystrokes**: Stroke-by-stroke typing from Gboard / tablet keyboard dock.
            * **☀️ Laptop Screen Brightness**: Direct backlight control (Dim, Brighten, Slider).
            * **✋ Drag Lock**: Click and hold to drag windows and select text.
            * **🔄 Reverse Scrolling Setting**: Invert scroll direction.

            ### 🚀 Quick Start
            1. Download `PCRemote.apk` below on your tablet or phone.
            2. On Laptop #1 and Laptop #2, run `start_server.bat`.
            3. Tap the laptop switcher pill in the top header on your tablet to switch between laptops instantly!
          files: release-artifacts/PCRemote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
