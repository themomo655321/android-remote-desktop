name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd android_client
          gradle assembleDebug --no-daemon

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp android_client/app/build/outputs/apk/debug/*.apk release-artifacts/PCRemote.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-debug-apk
          path: release-artifacts/PCRemote.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "PC Remote v1.0.4 (Connection Hub & Multi-PC Troubleshooter)"
          body: |
            ## 📱 PC Remote & Screen Mirror for Android (v1.0.4)
            Major connection and startup experience overhaul!

            ### ✨ What's New in v1.0.4:
            * **🚀 Brand New Connection Hub Dashboard**: Instant 0ms startup menu with live online/offline status for all your laptops!
            * **🔄 Network Refresh & Live Ping**: Tap "Refresh" to test and detect reachable laptops in real-time.
            * **🛡️ Windows Firewall Helper (`allow_firewall.bat`)**: 1-click script for Laptop #2 to open Port 5000 in 1 second.
            * **🛠️ Built-in Troubleshooting Guide**: Step-by-step help right in the app if a laptop fails to connect.
            * **🔑 Permanent Keystore Signing**: Eliminates "App not installed" update errors permanently.
            * **🏠 Home / Hub Button & Back Navigation**: Press Back or tap the Hub icon anytime to return to your laptops menu.

            ### 🚀 Quick Start
            1. Download and install `PCRemote.apk` below on your tablet or phone.
            2. On your laptops, run `start_server.bat` (and `allow_firewall.bat` if on a new laptop).
            3. Open PC Remote on your tablet—your laptops will be tested and ready to connect!
          files: |
            release-artifacts/PCRemote.apk
            allow_firewall.bat
            start_server.bat
            setup_laptop_2.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
